# Diagnóstico de dónde publican las revistas Makro, Diarco y Yaguar (no toca la tienda)
name: Diagnostico revistas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/ofertas-diag.mjs || true
      - name: Guardar
        if: always()
        run: |
          git config user.name "diag"; git config user.email "diag@users.noreply.github.com"
          mkdir -p diag; touch diag/fin.txt
          git checkout -B diag; git add -f diag; git commit -m "diag [skip netlify]" || true; git push -f origin diag
