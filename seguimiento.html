<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Seguí tu pedido · Proveeduría Virtual</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f8f5;--surface:#fff;--fg:#17241c;--muted:#5d6b62;--line:#dde5df;--brand:#1f5c3a;--brand-fg:#fff;--accent:#f2b630;--accent-fg:#2a1f00;--ok:#1d8a4e;--bad:#b3261e;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101612;--surface:#18211b;--fg:#e8efe9;--muted:#9aa9a0;--line:#2a352e;--brand:#16422a;--brand-fg:#eaf5ee;--ok:#4cc483;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101612;--surface:#18211b;--fg:#e8efe9;--muted:#9aa9a0;--line:#2a352e;--brand:#16422a;--brand-fg:#eaf5ee;--ok:#4cc483;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body)}
header{background:var(--brand);color:var(--brand-fg)}header div{max-width:560px;margin:auto;padding:14px 16px;font:800 1.3rem var(--display)}header a{color:inherit;text-decoration:none}header span{color:var(--accent)}
main{max-width:560px;margin:auto;padding:16px}
h1{font:800 1.7rem/1.15 var(--display);margin:.3em 0 .1em}.muted{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
ol.tl{list-style:none;margin:0;padding:0}
ol.tl li{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:18px}
ol.tl li:last-child{padding-bottom:0}
ol.tl li::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
ol.tl li:last-child::before{display:none}
ol.tl li.ok::before{background:var(--ok)}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font-size:16px}
li.ok .dot{background:var(--ok);border-color:var(--ok);color:#fff}
li.now .dot{border-color:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
li b{display:block}li.todo{color:var(--muted)}
.big{font:700 1.25rem var(--display)}
ul.it{margin:6px 0 0;padding-left:18px}.tot{display:flex;justify-content:space-between;font-weight:600;margin-top:8px}
.bad{color:var(--bad);font-weight:600}
a.btn{display:inline-block;background:var(--brand);color:var(--brand-fg);padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600}
</style></head><body>
<header><div><a href="/">Proveeduría <span>Virtual</span></a></div></header>
<main id="m"><p class="muted">Buscando tu pedido…</p></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plata=n=>"$ "+Math.round(n).toLocaleString("es-AR");
const cuando=f=>f?new Date(f).toLocaleString("es-AR",{weekday:"short",day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}):"";
const PASOS=[["nuevo","📥","Recibimos tu pedido","Ya lo tenemos cargado."],["preparando","📦","Lo estamos preparando","Compramos la mercadería y armamos tu pedido."],["en camino","🚚","En camino","Sale hoy para tu casa."],["entregado","✅","Entregado","¡Gracias por tu compra!"]];
async function cargar(){
  const id=new URLSearchParams(location.search).get("id");
  if(!id){$("#m").innerHTML='<h1>Seguí tu pedido</h1><p>Usá el link que te mandamos por mail cuando hiciste la compra.</p><p><a class="btn" href="/">Ir a la tienda</a></p>';return}
  const r=await fetch("/.netlify/functions/seguimiento?id="+encodeURIComponent(id)).catch(()=>null);
  const d=r&&await r.json().catch(()=>null);
  if(!r||!r.ok||!d){$("#m").innerHTML=`<h1>No encontramos el pedido</h1><p>${esc(d?.error||"Revisá el link o escribinos por WhatsApp.")}</p><p><a class="btn" href="/">Ir a la tienda</a></p>`;return}
  document.title="Pedido "+d.nro+" · "+d.etapaNombre;
  let cuerpo;
  if(d.etapa==="cancelado")cuerpo=`<p class="bad">Este pedido fue cancelado.</p><p class="muted">Si tenés dudas, escribinos por WhatsApp.</p>`;
  else if(d.etapa==="esperando pago")cuerpo=d.pagoRechazado?`<p class="bad">El pago no se aprobó.</p><p>Podés volver a intentarlo desde la tienda.</p>`:`<p class="big">⏳ Esperando que se acredite el pago</p><p class="muted">Apenas Mercado Pago lo confirme, tu pedido queda cargado y se actualiza esta página.</p>`;
  else{const k=PASOS.findIndex(p=>p[0]===d.etapa);
    cuerpo=`<ol class="tl">${PASOS.map((p,i)=>`<li class="${i<k?"ok":i===k?"ok now":"todo"}"><span class="dot">${i<=k?(i===k?p[1]:"✓"):""}</span><div><b>${p[2]}</b>${i<=k?`<span class="muted">${i===k?esc(p[3])+" ":""}${esc(cuando(d.cuando[p[0]]))}</span>`:""}</div></li>`).join("")}</ol>`}
  $("#m").innerHTML=`<p class="muted">Pedido ${esc(d.nro)} · ${esc(cuando(d.fecha))}</p><h1>${d.etapa==="entregado"?"¡Tu pedido llegó!":d.etapa==="cancelado"?"Pedido cancelado":"Hola "+esc(d.nombre)+", así va tu pedido"}</h1>
  <div class="card">${cuerpo}</div>
  ${d.entrega&&!["entregado","cancelado"].includes(d.etapa)?`<div class="card">🕒 <b>Entrega:</b> ${esc(d.entrega)}${d.pago==="efectivo"?`<br>💵 Lo pagás en efectivo al recibirlo: <b>${plata(d.total)}</b>`:""}</div>`:""}
  <div class="card"><b>Tu compra</b><ul class="it">${d.items.map(i=>`<li>${i.cantidad} x ${esc(i.nombre)}</li>`).join("")}</ul>
  ${d.envio>0?`<div class="tot"><span>Envío</span><span>${plata(d.envio)}</span></div>`:d.envioACoordinar?`<p class="muted">El envío lo coordinamos por WhatsApp.</p>`:""}
  <div class="tot"><span>Total</span><span>${plata(d.total)}</span></div></div>
  <p class="muted">Esta página se actualiza sola. Guardala para ver cómo va tu pedido.</p>
  <p><a class="btn" href="/">Volver a la tienda</a></p>`;
}
cargar();setInterval(()=>{if(!document.hidden)cargar()},60000);
</script>
</body></html>
