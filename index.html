<title>Proveeduría Virtual</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/icon-48.png" sizes="48x48" type="image/png"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/icon-192.png">

<style id="css">
/* Layout: barra verde fija arriba con buscador, chips de categoría, grilla de productos, carrito lateral (abajo en celular) */
:root{
  --bg:#f6f8f5; --surface:#ffffff; --fg:#17241c; --muted:#5d6b62; --line:#dde5df;
  --brand:#1f5c3a; --brand-fg:#ffffff; --accent:#f2b630; --accent-fg:#2a1f00; --ok:#1d8a4e;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#18211b; --fg:#e8efe9; --muted:#9aa9a0; --line:#2a352e;
  --brand:#16422a; --brand-fg:#eaf5ee; --accent:#f2b630; --accent-fg:#2a1f00; --ok:#4cc483; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211b; --fg:#e8efe9; --muted:#9aa9a0; --line:#2a352e;
  --brand:#16422a; --brand-fg:#eaf5ee; --accent:#f2b630; --accent-fg:#2a1f00; --ok:#4cc483; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-fg)}
.bar{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;white-space:nowrap}
.logo span{color:var(--accent)}
#q{flex:1 1 220px;min-width:0;padding:10px 14px;border-radius:999px;border:0;font:inherit;background:var(--surface);color:var(--fg)}
#q:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cartbtn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:10px 16px;font:600 15px var(--body);cursor:pointer;white-space:nowrap}
.cats{max-width:1200px;margin:0 auto;padding:0 16px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid color-mix(in srgb,var(--brand-fg) 35%,transparent);background:transparent;color:var(--brand-fg);border-radius:999px;padding:6px 12px;font:500 13px var(--body);cursor:pointer;text-transform:capitalize}
.chip[aria-pressed="true"]{background:var(--brand-fg);color:var(--brand)}
main{max-width:1200px;margin:0 auto;padding:16px 16px 96px}
.info{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.thumb{aspect-ratio:4/3;max-width:100%;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface));text-transform:uppercase}
.name{font-weight:500;text-transform:capitalize;font-size:14px;flex:1;overflow-wrap:anywhere}
.cat{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.price{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.add{border:0;border-radius:8px;padding:9px;background:var(--brand);color:var(--brand-fg);font:600 14px var(--body);cursor:pointer}
.qty{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px}
.qty button{border:0;background:none;color:var(--fg);font:600 18px var(--body);width:38px;height:36px;cursor:pointer}
.qty b{font-variant-numeric:tabular-nums}
.more{display:block;margin:20px auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:10px 20px;font:600 14px var(--body);cursor:pointer}
.empty{color:var(--muted);padding:40px 0;text-align:center}
aside{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:10;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:-12px 0 40px rgba(0,0,0,.18)}
aside h2{font-family:var(--display);font-size:1.4rem;margin:0}
.ahead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{border:0;background:none;color:var(--fg);font-size:26px;cursor:pointer}
.lines{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.line .name{font-size:13px}
.line .sub{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.tot{display:flex;justify-content:space-between;font-family:var(--display);font-weight:800;font-size:1.3rem;padding:12px 0}
label{font-size:13px;color:var(--muted);display:block;margin-top:6px}
input.f{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--fg)}
.wa{display:block;text-align:center;text-decoration:none;margin-top:12px;background:var(--ok);color:#fff;border-radius:10px;padding:12px;font-weight:600}
.copy{width:100%;margin-top:8px;border:1px solid var(--line);background:none;color:var(--fg);border-radius:10px;padding:10px;font:500 14px var(--body);cursor:pointer}
.note{font-size:12px;color:var(--muted);margin-top:8px}
footer{max-width:1200px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:12px}
.adminbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
#admin .lines{gap:14px}
#admin h3{font-family:var(--display);font-size:1.05rem;margin:4px 0 0}
#admin p,#admin li{font-size:13px;color:var(--muted);margin:0}
#admin ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
#admin code{display:block;max-height:64px;overflow:auto;font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-wrap:anywhere;color:var(--fg)}
.save{width:100%;border:0;border-radius:10px;padding:12px;background:var(--brand);color:var(--brand-fg);font:600 15px var(--body);cursor:pointer}
.save:disabled{opacity:.5;cursor:default}
.status{font-size:13px;font-weight:600;color:var(--fg);min-height:1.2em}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--brand)}}
</style>

<template id="shell"><header>
  <div class="bar">
    <div class="logo">Proveeduría <span>Virtual</span></div>
    <input id="q" type="search" placeholder="Buscá yerba, fideos, lavandina…" aria-label="Buscar productos">
    <button class="cartbtn" id="openCart" type="button">Carrito · <span id="cartCount">0</span></button>
  </div>
  <nav class="cats" id="cats" aria-label="Categorías"></nav>
</header>

<main>
  <div class="info"><span id="count"></span><span>Precios por unidad, con IVA · actualizados el <span id="fecha"></span></span></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No encontramos productos con esa búsqueda.</p>
  <button class="more" id="more" type="button">Ver más productos</button>
</main>
<footer>Pedidos por WhatsApp. Los precios pueden cambiar sin aviso. <button class="adminbtn" id="openAdmin" type="button" hidden>Administrar tienda</button></footer>

<aside id="cart" hidden aria-label="Carrito">

  <div class="lines" id="lines"></div>
  <div class="tot"><span>Total</span><span id="total">$ 0</span></div>
  <label for="cname">Tu nombre</label><input class="f" id="cname" autocomplete="name">
  <label for="caddr">Dirección de entrega</label><input class="f" id="caddr" autocomplete="street-address">
  <label for="cphone">Tu teléfono</label><input class="f" id="cphone" type="tel" autocomplete="tel">
  <button class="wa" id="pay" type="button" hidden style="border:0;width:100%;cursor:pointer;font:inherit">Pagar online (Mercado Pago)</button>
  <p class="note" id="payNote" hidden>Pagás con tarjeta, saldo de Mercado Pago o transferencia. Tu pedido queda cargado solo.</p>
  <a class="wa" id="wa" href="#" target="_blank" rel="noopener">Enviar pedido por WhatsApp (pagás al recibir)</a>
  <button class="copy" id="copy" type="button">Copiar pedido</button>
  <p class="note">WhatsApp de la tienda: <b id="waNum"></b>. Si el botón no abre WhatsApp, copiá el pedido y mandalo a ese número.</p>
</aside>


<aside id="admin" hidden aria-label="Administrar tienda">
  <div class="ahead"><h2>Administrar</h2><button class="x" id="closeAdmin" type="button" aria-label="Cerrar">×</button></div>
  <div class="lines">
    <p id="adminInfo"></p>
    <h3>Actualizar precios de Maxi</h3>
    <ol>
      <li>La primera vez: creá un marcador nuevo en Chrome, ponele de nombre <b>Bajar precios Maxi</b> y en la URL pegá este código.<code id="bm">javascript:(async()=>{const H='comerciante.carrefour.com.ar';if(location.host!==H){alert('Primero abrí '+H+' y después tocá este marcador');return}let C=[...new Set([...document.querySelectorAll('a[href*="/sec/"]')].map(a=>decodeURIComponent(a.pathname.split('/sec/')[1]||'').split('/')[0]))].filter(Boolean);if(!C.length)C=['bebidas','almacén','desayuno y merienda','limpieza','perfumería','lácteos y productos frescos','mundo bebé','mascotas','panadería','bazar y textil'];const S=new Set(),L=[];for(let i=0;i&lt;C.length;i++){document.title='Bajando precios '+(i+1)+'/'+C.length;const r=await fetch('/products?currentUrl=sec/'+encodeURIComponent(C[i])+'&amp;filters=&amp;orderBy=default&amp;currentPage=1&amp;itemsPerPage=5000&amp;method=productsList');const d=new DOMParser().parseFromString(await r.text(),'text/html');for(const k of d.querySelectorAll('.item_card')){const n=(k.querySelector('.item_card__description')?.textContent||'').replace(/\s+/g,' ').trim().replace(/\|/g,'/');const t=k.textContent.replace(/\s+/g,' ');const e=(t.match(/ID:\s*(\d+)/)||[])[1];const m=(t.match(/Llevando\s+(\d+)/i)||[])[1]||'';const p=t.match(/\$\s*([\d,]+(?:\.\d+)?)/);if(!e||!p||S.has(e))continue;S.add(e);L.push([i,e,m,parseFloat(p[1].replace(/,/g,'')),n].join('|'))}}const x='\x23cats|'+C.join('|')+'\n\x23formato: cat|ean|minimo|precio_maxi|nombre\n'+L.join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'text/plain'}));a.download='maxi_productos.txt';document.body.appendChild(a);a.click();a.remove();document.title='Listo: '+L.length+' productos';alert('Listo: '+L.length+' productos. Ahora subí maxi_productos.txt en el panel de tu tienda.')})();</code><button class="copy" id="copyBm" type="button">Copiar código del marcador</button></li>
      <li>Entrá a Maxi (comerciante.carrefour.com.ar) y tocá el marcador. Esperá el cartel de "Listo" y se baja <b>maxi_productos.txt</b>.</li>
      <li>Subí ese archivo acá abajo y tocá Guardar.</li>
    </ol>
    <label for="file">Archivo de Maxi</label><input class="f" id="file" type="file" accept=".txt,text/plain">
    <label for="margen">Ganancia sobre el precio Maxi (%)</label><input class="f" id="margen" type="number" min="0" max="500" step="1">
    <label for="waIn">WhatsApp para pedidos (con 549 + código de área, sin espacios)</label><input class="f" id="waIn" inputmode="numeric" placeholder="5491123456789">
    <p class="status" id="status" role="status"></p>
  </div>
  <button class="save" id="save" type="button">Guardar y actualizar tienda</button>
</aside>
</template>

<script id="app">
const SHELL=document.getElementById("shell");
document.body.prepend(SHELL.content.cloneNode(true));
const D=JSON.parse(document.getElementById("data").textContent); // {wa, margen, fecha, cats, p:[cat,ean,nombre,precio]} (precio = venta; el costo Maxi no se guarda en la página)
const CATS=D.cats, P=D.p;
const PLACEHOLDER="5491100000000";
const fmt=n=>"$ "+n.toLocaleString("es-AR");
let cat=-1, q="", shown=60, cart={};
try{cart=JSON.parse(localStorage.getItem("cart")||"{}")}catch(e){}
const byEan=Object.fromEntries(P.map(p=>[p[1],p]));
const $=id=>document.getElementById(id);
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
P.forEach(p=>p.k=norm(p[2]));
$("fecha").textContent=D.fecha;
$("waNum").textContent=D.wa===PLACEHOLDER?"todavía no configurado":"+"+D.wa;
function initials(n){return n.split(" ").filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join("")}
function chips(){
  const all=[["Todo",-1],...CATS.map((c,i)=>[c,i])].filter(([c,i])=>i<0||P.some(p=>p[0]===i));
  $("cats").innerHTML=all.map(([c,i])=>`<button class="chip" type="button" data-c="${i}" aria-pressed="${i===cat}">${c}</button>`).join("");
}
function list(){
  const words=norm(q).split(/\s+/).filter(Boolean);
  return P.filter(p=>(cat<0||p[0]===cat)&&words.every(w=>p.k.includes(w)));
}
function qtyCtl(e,n){return `<div class="qty"><button type="button" data-d="-1" data-e="${e}" aria-label="Quitar uno">−</button><b>${n}</b><button type="button" data-d="1" data-e="${e}" aria-label="Agregar uno">+</button></div>`}
function card(p){
  const n=cart[p[1]]||0;
  return `<div class="card"><div class="thumb">${initials(p[2])}</div><div class="cat">${CATS[p[0]]}</div><div class="name">${p[2]}</div><div class="price">${fmt(p[3])}</div>${n?qtyCtl(p[1],n):`<button class="add" type="button" data-d="1" data-e="${p[1]}">Agregar</button>`}</div>`;
}
function render(){
  const l=list();
  $("count").textContent=l.length.toLocaleString("es-AR")+" productos";
  $("grid").innerHTML=l.slice(0,shown).map(card).join("");
  $("empty").hidden=l.length>0; $("more").hidden=l.length<=shown;
  renderCart();
}
function items(){return Object.entries(cart).filter(([e,n])=>n>0&&byEan[e])}
function renderCart(){
  let tot=0, units=0; const it=items();
  $("lines").innerHTML=it.length?it.map(([e,n])=>{const p=byEan[e];tot+=p[3]*n;units+=n;
    return `<div class="line"><div class="name">${p[2]}</div><div class="sub">${fmt(p[3]*n)}</div>${qtyCtl(e,n)}</div>`}).join(""):'<p class="empty">Todavía no agregaste productos.</p>';
  $("total").textContent=fmt(tot); $("cartCount").textContent=units;
  $("wa").href="https://wa.me/"+D.wa+"?text="+encodeURIComponent(msg());
  try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}
}
function plain(s){const t=document.createElement("textarea");t.innerHTML=s;return t.value}
function msg(){
  let tot=0;
  const rows=items().map(([e,n])=>{const p=byEan[e];tot+=p[3]*n;return `• ${n} x ${plain(p[2])} — ${fmt(p[3]*n)}`});
  return `Hola! Quiero hacer este pedido:\n${rows.join("\n")}\nTotal: ${fmt(tot)}\nNombre: ${$("cname").value}\nDirección: ${$("caddr").value}`;
}
async function copyText(text,btn,ok,label){
  try{await navigator.clipboard.writeText(text);btn.textContent=ok}catch(e){btn.textContent="No se pudo copiar: seleccioná el texto a mano"}
  setTimeout(()=>btn.textContent=label,2500);
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-e]");
  if(b){const e=b.dataset.e;cart[e]=Math.max(0,(cart[e]||0)+ +b.dataset.d);if(!cart[e])delete cart[e];render();return}
  const c=ev.target.closest("[data-c]");
  if(c){cat=+c.dataset.c;shown=60;chips();render();}
});
$("q").addEventListener("input",e=>{q=e.target.value;shown=60;render()});
$("more").onclick=()=>{shown+=60;render()};
$("openCart").onclick=()=>{$("cart").hidden=false};
$("closeCart").onclick=()=>{$("cart").hidden=true};
["cname","caddr"].forEach(id=>$(id).addEventListener("input",renderCart));
$("copy").onclick=()=>copyText(msg(),$("copy"),"Pedido copiado","Copiar pedido");
const PAYON=/\.netlify\.app$/.test(location.hostname);
if(PAYON){$("pay").hidden=false;$("payNote").hidden=false}
$("pay").onclick=async()=>{
  const btn=$("pay"), lab="Pagar online (Mercado Pago)";
  const say=t=>{btn.textContent=t;setTimeout(()=>btn.textContent=lab,3500)};
  const it=items();
  if(!it.length) return say("Primero agregá productos");
  if(!$("cname").value.trim()||!$("caddr").value.trim()||$("cphone").value.replace(/\D/g,"").length<8) return say("Completá nombre, dirección y teléfono");
  btn.disabled=true; btn.textContent="Un momento…";
  try{
    const r=await fetch("/.netlify/functions/crear-pago",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({items:it.map(([e,n])=>({e,n})),nombre:$("cname").value,direccion:$("caddr").value,telefono:$("cphone").value})});
    const d=await r.json();
    if(!r.ok||!d.url) throw new Error(d.error||"No se pudo iniciar el pago");
    location.href=d.url;
  }catch(e){say(e.message)}
  btn.disabled=false;
};

/* ---------- Panel del dueño: sube el archivo de Maxi y la página se vuelve a publicar ---------- */
let pending=null;
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#x27;")}
function parseMaxi(txt){
  const lines=txt.split(/\r?\n/).filter(Boolean);
  if(!lines[0]||!lines[0].startsWith("#cats|")) throw new Error("Ese archivo no es el de Maxi. Usá el maxi_productos.txt que baja el marcador.");
  const cats=lines[0].split("|").slice(1); const maxi={}; const rows=[];
  for(const l of lines.slice(1)){
    if(l.startsWith("#")) continue;
    const [c,ean,,precio,...rest]=l.split("|"); const pr=parseFloat(precio);
    if(!ean||!(pr>0)) continue;
    maxi[ean]=pr; rows.push([+c,ean,esc(rest.join("|").trim().replace(/\.$/,"")),pr]);
  }
  if(rows.length<500) throw new Error(`El archivo trae solo ${rows.length} productos, parece incompleto. Volvé a tocar el marcador en Maxi.`);
  return {cats,maxi,rows};
}
function price(pm,margen){return Math.ceil(pm*(1+margen/100)/10)*10}
function preview(){
  const margen=+$("margen").value, st=$("status");
  if(!(margen>=0)){st.textContent="Poné un porcentaje de ganancia válido.";return}
  if(!pending){st.textContent=`Ahora: ${P.length.toLocaleString("es-AR")} productos, ganancia ${D.margen}%.`;return}
  let up=0,down=0,nuevos=0;
  for(const r of pending.rows){const old=byEan[r[1]];const np=price(r[3],margen);if(!old)nuevos++;else if(np>old[3])up++;else if(np<old[3])down++;}
  const gone=P.filter(p=>!pending.maxi[p[1]]).length;
  st.textContent=`${pending.rows.length.toLocaleString("es-AR")} productos · ${up} suben · ${down} bajan · ${nuevos} nuevos · ${gone} ya no están en Maxi.`;
}
function buildDoc(newData){
  const reset=(document.head.querySelector("style")||{}).textContent||":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}";
  const json=JSON.stringify(newData).replace(/</g,"\\u003c");
  const fonts='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +'<title>Proveeduría Virtual</title>\n'+fonts+'\n<style id="css">'+$("css").textContent+'</style>\n'
    +'<template id="shell">'+SHELL.innerHTML+'</template>\n'
    +'<script id="data" type="application/json">'+json+'<\/script>\n'
    +'<script id="app">'+$("app").textContent+'<\/script>\n</body></html>';
}
(async()=>{
  if(typeof claude==="undefined") return;
  const [artifact,user]=await Promise.all([claude.use("artifact"),claude.use("user")]);

  const canEdit=await (user?.canEdit()??Promise.resolve(false));

    let nd;
    if(pending){
      nd={wa:wa||PLACEHOLDER,margen,fecha:new Date().toLocaleDateString("es-AR"),cats:pending.cats,
          p:pending.rows.map(r=>[r[0],r[1],r[2],price(r[3],margen)]).sort((a,b)=>a[0]-b[0]||a[2].localeCompare(b[2]))};
    }else{
      if(margen!==D.margen){st.textContent="Para cambiar la ganancia subí también el archivo de Maxi.";return}
      nd={...D,wa:wa||PLACEHOLDER};
    }
    $("save").disabled=true; st.textContent="Guardando… la tienda se va a recargar sola.";
    try{await artifact.publish(buildDoc(nd))}
    catch(err){
      $("save").disabled=false;
      st.textContent=err.code==="conflict"?"Alguien guardó al mismo tiempo; la página se recarga, probá de nuevo."
        :err.code==="not_writer"||err.code==="not_granted"?"Desde esta cuenta no se puede guardar la tienda."
        :"No se pudo guardar ("+err.code+"). Probá de nuevo en un rato.";
    }
  };
})();
</script>

</body></html>
